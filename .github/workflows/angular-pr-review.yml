name: Angular PR Review

# Runs the angular-pr-review skill automatically whenever a PR is opened or updated,
# and posts the best-practices review as a comment on the PR.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least-privilege: read the code, write PR comments.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the diff base...head is available

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Angular best-practices review
        uses: anthropics/claude-code-action@v1
        with:
          # Add ANTHROPIC_API_KEY in: repo Settings → Secrets and variables → Actions.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Use the `angular-pr-review` skill in .claude/skills/angular-pr-review/SKILL.md.
            Review only the files changed in this pull request (the diff between the base
            branch and the head commit). Run the lint and build gates, apply the Angular v22
            checklist, and post the resulting report as a single PR comment using the exact
            output format defined in the skill. End with an explicit APPROVE or
            REQUEST CHANGES verdict.
          claude_args: |
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(npx ng lint),Bash(npx ng build),Read,Grep,Glob"
